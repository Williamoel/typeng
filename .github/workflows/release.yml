name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-lexicon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build compact runtime lexicon
        shell: bash
        run: |
          BUILD_HOME="$RUNNER_TEMP/typeng-lexicon-build"
          mkdir -p "$BUILD_HOME/resources" resources/lexicon
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 600 \
            -o "$BUILD_HOME/resources/ecdict.csv" \
            "https://raw.githubusercontent.com/skywind3000/ECDICT/master/ecdict.csv"
          mkdir -p "$BUILD_HOME/resources/efllex"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 600 \
            -o "$BUILD_HOME/resources/efllex/EFLLex.tsv" \
            "https://cental.uclouvain.be/cefrlex/static/resources/en/EFLLex.tsv"
          mkdir -p "$BUILD_HOME/resources/wiktionary"
          cp resources/wiktionary/exam-pos-index.tsv \
            "$BUILD_HOME/resources/wiktionary/exam-pos-index.tsv"
          python scripts/prepare_lexicon_cache.py \
            --build-home "$BUILD_HOME" \
            --output resources/lexicon/typeng-lexicon.sqlite3

      - name: Upload runtime lexicon
        uses: actions/upload-artifact@v4
        with:
          name: runtime-lexicon
          path: resources/lexicon/typeng-lexicon.sqlite3

  build:
    needs: prepare-lexicon
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: windows-x64
          - os: macos-latest
            platform_name: macos-arm64
          - os: macos-15-intel
            platform_name: macos-x64
          - os: ubuntu-latest
            platform_name: linux-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download runtime lexicon
        uses: actions/download-artifact@v4
        with:
          name: runtime-lexicon
          path: resources/lexicon

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --name typeng --onedir
          --add-data "templates;templates"
          --add-data "static;static"
          --add-data "resources;resources"
          --add-data "samples;samples"
          --add-data "README.md;."
          --add-data "README.zh-CN.md;."
          --add-data "SOURCES.md;."
          run_typeng.py

      - name: Build with PyInstaller (macOS / Linux)
        if: runner.os != 'Windows'
        run: >
          pyinstaller --noconfirm --clean --name typeng --onedir
          --add-data "templates:templates"
          --add-data "static:static"
          --add-data "resources:resources"
          --add-data "samples:samples"
          --add-data "README.md:."
          --add-data "README.zh-CN.md:."
          --add-data "SOURCES.md:."
          run_typeng.py

      - name: Add user-facing folders and docs to the bundle
        shell: bash
        run: |
          mkdir -p dist/typeng/data
          mkdir -p dist/typeng/resources/wiktionary
          cp README.md README.zh-CN.md SOURCES.md dist/typeng/
          cp resources/README.md dist/typeng/resources/README.md
          cp -r samples dist/typeng/ 2>/dev/null || true
          # Ship the Chinese dictionary-setup guide (PDF) at the top level so
          # users see it right after extracting.
          cp "docs/词典安装指南.pdf" dist/typeng/ 2>/dev/null \
            || echo "::warning::词典安装指南.pdf not found; skipping."

      - name: Smoke test the built executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE="dist/typeng/typeng.exe"
          else
            EXE="dist/typeng/typeng"
          fi
          # Force data into a known location so we can reliably find
          # server_url.txt — the app now uses platform-standard dirs by
          # default, which would scatter data across the runner's home.
          export TYPENG_HOME="dist/typeng"
          "$EXE" &
          APP_PID=$!
          URL=""
          for i in $(seq 1 30); do
            if [ -z "$URL" ] && [ -f dist/typeng/data/server_url.txt ]; then
              URL="$(cat dist/typeng/data/server_url.txt)"
            fi
            if [ -n "$URL" ] && curl -sf "$URL" > /dev/null; then
              echo "Server responded at $URL"
              kill "$APP_PID"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond within 30s (URL='$URL')" >&2
          kill "$APP_PID" || true
          exit 1

      - name: Zip the bundle
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          ZIP_NAME="typeng-${VERSION}-${{ matrix.platform_name }}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../$ZIP_NAME" typeng
          else
            zip -qr "../$ZIP_NAME" typeng
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

  release:
    needs: build
    # Publish whatever platforms succeeded even if one runner failed or was
    # unavailable, as long as the build job was not cancelled and at least one
    # artifact exists. `always()` lets this run despite a failed matrix leg.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release and attach packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            TypEng v0.3 adds an account-enabled web deployment, per-user data
            isolation, a black-rail workspace, stable custom units, fixed
            expressions, improved Wiktionary cleanup, library export, and
            optional learner feedback for Cloze examples.

            The desktop packages remain local-first and require no account.
            They are built automatically by GitHub Actions.

            **Windows**: download the `windows-x64` zip, extract it, and
            double-click `typeng.exe`. The browser opens automatically.

            **macOS**: download the `macos-arm64` (Apple Silicon) or
            `macos-x64` (Intel) zip, extract it, then run `typeng` inside the
            folder. If macOS blocks the unsigned app, right-click and choose
            Open, or run `xattr -dr com.apple.quarantine <extracted folder>`.

            **Linux**: download the `linux-x64` zip, extract it, then run
            `./typeng`.

            A preprocessed lexicon is included; users do not need to download
            raw dictionary files. The standalone `typeng-lexicon.sqlite3`
            asset is also used by hosted deployments. See `SOURCES.md` for
            data provenance.
          files: |
            artifacts/*.zip
            artifacts/typeng-lexicon.sqlite3
